name: add-case13-card
on:
  push:
    paths:
      - ".github/workflows/add-case13-card.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert CASE 13 card and self-clean
        run: |
          python3 - <<'PY'
          import base64, pathlib
          card = base64.b64decode("").decode("utf-8")
          p = pathlib.Path("index.html")
          h = p.read_text(encoding="utf-8")
          if "CASE 13" in h:
              print("already patched, skip insert")
          else:
              a = '<a class="demo-link" href="case-12.html">read it →</a>'
              i = h.index(a)
              j = h.index("</article>", i) + len("</article>")
              h = h[:j] + "\n" + card + h[j:]
              p.write_text(h, encoding="utf-8")
              print("patched")
          PY
          git config user.name "liudeva2024"
          git config user.email "liudeva2024@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/add-case13-card.yml
          git commit -m "home: add CASE 13 card"
          git push origin HEAD:main

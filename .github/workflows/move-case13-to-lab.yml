name: move-case13-to-lab
on:
  push:
    paths:
      - ".github/workflows/move-case13-to-lab.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move CASE 13 card into Field Lab and self-clean
        run: |
          python3 - <<'PY'
          import base64, pathlib
          card = base64.b64decode("").decode("utf-8")
          p = pathlib.Path("index.html")
          h = p.read_text(encoding="utf-8")
          if "FIELD STORIES · CASE 13" in h:
              i = h.index("FIELD STORIES · CASE 13")
              start = h.rindex('<article class="note-card">', 0, i)
              start = h.rindex("\n", 0, start)
              end = h.index("</article>", i) + len("</article>")
              h = h[:start] + h[end:]
              anchor = '<a class="demo-link" href="podcast-tracker.html">read it →</a>'
              j = h.index("</article>", h.index(anchor)) + len("</article>")
              h = h[:j] + "\n" + card + h[j:]
              p.write_text(h, encoding="utf-8")
              print("moved")
          else:
              print("card already moved, skip")
          q = pathlib.Path("case-13.html")
          c = q.read_text(encoding="utf-8")
          if "FIELD STORIES" in c:
              q.write_text(c.replace("FIELD STORIES", "FIELD LAB"), encoding="utf-8")
              print("page label updated")
          PY
          git config user.name "liudeva2024"
          git config user.email "liudeva2024@users.noreply.github.com"
          git add index.html case-13.html
          git rm -f .github/workflows/move-case13-to-lab.yml
          git commit -m "home: move CASE 13 card to Field Lab"
          git push origin HEAD:main

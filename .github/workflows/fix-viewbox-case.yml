name: fix-viewbox-case
on:
  push:
    paths:
      - ".github/workflows/fix-viewbox-case.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize viewBox attribute and self-clean
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("index.html")
          h = p.read_text(encoding="utf-8")
          n = h.count("viewbox=")
          if n:
              p.write_text(h.replace("viewbox=", "viewBox="), encoding="utf-8")
              print("fixed", n)
          else:
              print("nothing to fix")
          PY
          git config user.name "liudeva2024"
          git config user.email "liudeva2024@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/fix-viewbox-case.yml
          git commit -m "home: normalize svg viewBox attribute"
          git push origin HEAD:main
